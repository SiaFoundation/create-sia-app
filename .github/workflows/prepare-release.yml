name: Prepare Release

on:
  push:
    branches: [main]

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # An app token, not GITHUB_TOKEN: a pull request opened with the workflow
      # token does not run its checks, so the release PR cannot be verified
      # before it merges.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          # knope force-pushes the release branch later in the run, using the
          # credentials checkout saves here.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - run: knope prepare-release --verbose
        env:
          # knope shells out to `gh` to open the release PR, which reads this.
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        continue-on-error: true
